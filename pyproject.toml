[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chicell2cell"
version = "0.1.0"
description = "Spatial transcriptomics cell-cell communication via GAT-VAE"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chigozie Godwin", email = "chigoziegodwin93@gmail.com" }]
requires-python = ">=3.9"
keywords = ["spatial transcriptomics", "cell-cell communication", "graph attention network", "variational autoencoder", "glioblastoma"]
dependencies = [
    "scanpy>=1.9", "anndata>=0.9", "squidpy>=1.3",
    "pandas>=1.5", "numpy>=1.23", "matplotlib>=3.7",
    "seaborn>=0.12", "scikit-learn>=1.2", "scipy>=1.10",
    "torch>=2.0", "torch-geometric>=2.3", "tqdm>=4.65",
    "mygene>=3.2", "scrublet>=0.2",
]
[project.optional-dependencies]
comparison = ["upsetplot>=0.8"]
dev = ["pytest>=7", "black", "isort"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chicell2cell*"]
